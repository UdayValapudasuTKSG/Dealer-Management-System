      properties:
        configured:
          type: boolean
          description: "True when a page token, app secret and verify token are all available for this dealer (stored or platform env)"
        missing:
          type: array
          items: { type: string }
          description: "Names (never values) of the platform Meta env keys still unset"
        callbackUrl:
          type: string
          description: "Webhook callback URL to paste into the Meta App dashboard"
        metaPageId:
          type: ["string", "null"]
          description: "This dealership's Facebook Page ID; null = not connected"
        hasPageAccessToken:
          type: boolean
          description: "True when this dealer has its own stored Page access token"
        hasAppSecret:
          type: boolean
          description: "True when this dealer has its own stored app secret"
        verifyToken:
          type: ["string", "null"]
          description: "This dealer's webhook verify token (GM-readable — it must be pasted into the Meta dashboard); null for non-managers or when unset"
        usingPlatformCredentials:
          type: boolean
          description: "True when the dealer has no stored token and the platform env credentials are in effect"
        lastStatus:
          type: ["string", "null"]
          description: "connected | error | null (never tested)"
        lastError:
          type: ["string", "null"]
        lastCheckedAt:
          type: ["string", "null"]
          format: date-time
        lastEvent:
          type: ["object", "null"]
          required: [externalId, createdAt]
          properties:
            externalId: { type: string, description: "Meta leadgen id" }
            leadId: { type: ["integer", "null"] }
            leadName: { type: ["string", "null"] }
            leadSource: { type: ["string", "null"], description: "facebook | instagram" }
            createdAt: { type: string, format: date-time }
          description: "Most recent Meta campaign lead received for THIS dealership, or null if none yet"
        tokenExchange:
          type: ["object", "null"]
          required: [tokenType, exchanged, pageName, missingScopes, grantedScopes, error]
          properties:
            tokenType: { type: ["string", "null"], enum: [page, user, null], description: "What the pasted token identified as" }
            exchanged: { type: boolean, description: "True when a pasted USER token was automatically converted to the Page token before storing" }
            pageName: { type: ["string", "null"], description: "Name of the Page the stored token belongs to, when known" }
            missingScopes:
              type: ["array", "null"]
              items: { type: string }
              description: "Required Meta permissions the pasted token lacks; null when scopes could not be inspected"
            grantedScopes:
              type: ["array", "null"]
              items: { type: string }
              description: "Required Meta permissions the pasted token grants; null when scopes could not be inspected"
            error: { type: ["string", "null"], description: "Problem encountered while inspecting/converting the pasted token (the token is still stored)" }
