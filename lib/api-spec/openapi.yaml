    get:
      operationId: listEmailTemplates
      tags: [emails]
      summary: List the email trigger catalog
      responses:
        "200":
          description: Template catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmailTemplateInfo"
  /emails/templates/{key}/preview:
    get:
      operationId: previewEmailTemplate
      tags: [emails]
      summary: Rendered HTML preview of a template with sample data
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Rendered template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailTemplatePreview"
        "404":
          description: Unknown template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /emails/send:
    post:
      operationId: enqueueEmail
      tags: [emails]
      summary: Enqueue a templated email (manual trigger)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnqueueEmailRequest"
      responses:
        "201":
          description: Queued email log entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailLog"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /emails/logs:
    get:
      operationId: listEmailLogs
      tags: [emails]
      summary: Delivery log of every email
      parameters:
        - name: customerId
          in: query
          required: false
          schema: { type: integer }
        - name: status
          in: query
          required: false
          schema: { type: string }
        - name: channel
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Email logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmailLog"

  /emails/logs/{id}/retry:
    post:
      operationId: retryEmailLog
      tags: [emails]
      summary: Re-queue a failed outbox item for immediate retry
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Item re-queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailLog"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Item is not in a retryable state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /calendar:
    get:
      operationId: getCalendar
      tags: [calendar]
      summary: Dealership calendar — test drives, deliveries, service appointments, and follow-ups due
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: Events in range, role-scoped (advisors see their own)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarResponse"

  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: Current user's notifications
      responses:
        "200":
          description: Notifications, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"
  /notifications/read:
    post:
      operationId: markNotificationsRead
      tags: [notifications]
      summary: Mark notifications as read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkNotificationsReadRequest"
      responses:
        "200":
          description: Number of notifications marked read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarkNotificationsReadResult"

  /leads/{id}/notify-owner:
    post:
      operationId: notifyLeadOwner
      tags: [leads]
      summary: Send an in-app push notification to the lead owner with a suggested action
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotifyOwnerInput"
      responses:
        "200":
          description: Notification queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotifyOwnerResult"
        "400":
          description: Lead has no owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      summary: List tasks
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string }
        - name: assigneeUserId
          in: query
          required: false
          schema: { type: integer }
        - name: leadId
          in: query
          required: false
          schema: { type: integer }
      responses:
        "200":
          description: Tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
    post:
      operationId: createTask
      tags: [tasks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
  /tasks/{id}:
    patch:
      operationId: updateTask
      tags: [tasks]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteTask
      tags: [tasks]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted
  /tasks/{id}/comments:
    get:
      operationId: listTaskComments
      tags: [tasks]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaskComment"
    post:
      operationId: createTaskComment
      tags: [tasks]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskCommentInput"
      responses:
        "201":
          description: Created comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskComment"
        "404":
          description: Task not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /customers/{id}/communications:
    get:
      operationId: getCustomerCommunications
      tags: [customers]
      summary: Communication center data for a customer
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Emails, notes and timeline for the customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerCommunications"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /customers/{id}/comm-notes:
    post:
      operationId: createCommNote
      tags: [customers]
      summary: Log a call or meeting note against a customer
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommNoteInput"
      responses:
        "201":
          description: Created note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommNote"
        "404":
          description: Customer not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      description: |
        Returns a presigned GCS URL for direct upload. The client sends JSON
        metadata here, then uploads the file directly to the returned URL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /storage/public-objects/{filePath}:
    get:
      tags: [Storage]
      operationId: getPublicObject
      summary: Serve a public asset from PUBLIC_OBJECT_SEARCH_PATHS
      description: |
        Unconditionally public — no authentication or ACL checks.
        Searches PUBLIC_OBJECT_SEARCH_PATHS for the given file path.
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
          description: Relative file path within the public search paths.
      responses:
        "200":
          description: Object content streamed with correct Content-Type.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: File not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Failed to serve public object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      description: |
        Serves object entities uploaded via presigned URLs. These can optionally
        be protected with authentication or ACL checks based on the use case.
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
          description: Object path within the private object dir (e.g. `uploads/some-uuid`).
      responses:
        "200":
          description: Object content streamed with correct Content-Type.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Failed to serve object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    PermissionGrant:
      type: object
      required: [module, category]
      properties:
        module:
          type: string
          enum: [dashboard, inventory, leads, deals, appraisals, finance, service, parts, deliveries, customers, approvals, gra, settings]
        category:
          type: string
          enum: [view, create, edit, delete, approve, reject, export, assign, admin]
    CurrentUser:
      type: object
      required: [id, clerkId, roleName, permissions, status, isSuperAdmin, dealers]
      properties:
        id: { type: integer }
        clerkId: { type: string }
        email: { type: ["string", "null"] }
        name: { type: ["string", "null"] }
        imageUrl: { type: ["string", "null"] }
        roleId: { type: ["integer", "null"] }
        roleName: { type: ["string", "null"] }
        status: { type: string }
        isSuperAdmin: { type: boolean }
        activeDealerId: { type: ["integer", "null"] }
        dealers:
          type: array
          items:
            $ref: "#/components/schemas/DealerMembershipInfo"
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/PermissionGrant"
    DealerMembershipInfo:
      type: object
      required: [dealerId, dealerName]
      properties:
        dealerId: { type: integer }
        dealerName: { type: string }
        roleName: { type: ["string", "null"] }
        isGeneralManager: { type: boolean }
        usdExchangeRate: { type: number, description: "GYD per 1 USD for this dealership" }
    Dealer:
      type: object
      required: [id, name, status, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        city: { type: ["string", "null"] }
        country: { type: ["string", "null"] }
        status: { type: string, enum: [active, inactive] }
        usdExchangeRate: { type: number, description: "GYD per 1 USD" }
        userCount: { type: integer }
        createdAt: { type: string, format: date-time }
    DealerInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        city: { type: ["string", "null"] }
        country: { type: ["string", "null"] }
        status: { type: string, enum: [active, inactive] }
        usdExchangeRate: { type: number, exclusiveMinimum: 0, description: "GYD per 1 USD" }
    Division:
      type: object
      required: [id, dealerId, name, code]
      properties:
        id: { type: integer }
        dealerId: { type: integer }
        name: { type: string }
        code: { type: string, enum: [CAM, GT] }
    DealerMember:
      type: object
      required: [id, userId, dealerId, roleId, isGeneralManager]
      properties:
        id: { type: integer }
        userId: { type: integer }
        dealerId: { type: integer }
        roleId: { type: integer }
        roleName: { type: ["string", "null"] }
        isGeneralManager: { type: boolean }
        email: { type: ["string", "null"] }
        name: { type: ["string", "null"] }
        imageUrl: { type: ["string", "null"] }
        userStatus: { type: string }
    DealerMemberInput:
      type: object
      required: [roleId]
      properties:
        userId: { type: ["integer", "null"] }
        email: { type: ["string", "null"] }
        roleId: { type: integer }
        isGeneralManager: { type: boolean }
    PlatformUser:
      type: object
      required: [id, clerkId, status, createdAt, dealerCount]
      properties:
        id: { type: integer }
        clerkId: { type: string }
        email: { type: ["string", "null"] }
        name: { type: ["string", "null"] }
        imageUrl: { type: ["string", "null"] }
        status: { type: string }
        dealerCount: { type: integer }
        createdAt: { type: string, format: date-time }
    TeamMemberLead:
      type: object
      required: [id, name, status, phase, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        status: { type: string }
        phase: { type: string }
        createdAt: { type: string, format: date-time }
    TeamMemberProfile:
      type: object
      required: [id, name, status, openLeads, totalLeads, wonLeads, upcomingTestDrives, recentLeads, memberSince]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: ["string", "null"] }
        imageUrl: { type: ["string", "null"] }
        roleName: { type: ["string", "null"] }
        status: { type: string }
        memberSince: { type: string, format: date-time }
        lastLoginAt: { type: ["string", "null"], format: date-time }
        openLeads: { type: integer }
        totalLeads: { type: integer }
        wonLeads: { type: integer }
        upcomingTestDrives: { type: integer }
        recentLeads:
          type: array
          items: { $ref: "#/components/schemas/TeamMemberLead" }
    AdminUser:
      type: object
      required: [id, clerkId, status, createdAt]
      properties:
        id: { type: integer }
        clerkId: { type: string }
        email: { type: ["string", "null"] }
        name: { type: ["string", "null"] }
        imageUrl: { type: ["string", "null"] }
        roleId: { type: ["integer", "null"] }
        roleName: { type: ["string", "null"] }
        status: { type: string, enum: [active, suspended] }
        reportingManagerUserId: { type: ["integer", "null"] }
        reportingManagerName: { type: ["string", "null"] }
        divisionId: { type: ["integer", "null"] }
        divisionName: { type: ["string", "null"] }
        lastLoginAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
    AdminUserUpdate:
      type: object
      properties:
        roleId: { type: ["integer", "null"] }
        status: { type: string, enum: [active, suspended] }
        reportingManagerUserId: { type: ["integer", "null"] }
        divisionId: { type: ["integer", "null"] }
    AdminUserAdd:
      type: object
      required: [email, roleId]
      properties:
        email: { type: string }
        roleId: { type: integer }
    RoleWithPermissions:
      type: object
      required: [id, name, isSystem, userCount, permissions, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: ["string", "null"] }
        isSystem: { type: boolean }
        userCount: { type: integer }
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/PermissionGrant"
        fieldPermissions:
          type: array
          items:
            $ref: "#/components/schemas/FieldAccessGrant"
        createdAt: { type: string, format: date-time }
    RolePermissionsInput:
      type: object
      required: [grants]
      properties:
        grants:
          type: array
          items:
            $ref: "#/components/schemas/PermissionGrant"
    FieldAccessGrant:
      type: object
      required: [fieldGroup, access]
      properties:
        fieldGroup: { type: string }
        access: { type: string, enum: [hidden, view, edit] }
    FieldGroupMeta:
      type: object
      required: [key, label, module, fields]
      properties:
        key: { type: string }
        label: { type: string }
        module: { type: string }
        fields:
          type: array
          items: { type: string }
    RoleFieldPermissionsInput:
      type: object
      required: [grants]
      properties:
        grants:
          type: array
          items:
            $ref: "#/components/schemas/FieldAccessGrant"
    LeadSourceConfig:
      type: object
      required: [id, dealerId, code, name, isSocial, active, sortOrder]
      properties:
        id: { type: integer }
        dealerId: { type: integer }
        code: { type: string }
        name: { type: string }
        isSocial: { type: boolean }
        active: { type: boolean }
        sortOrder: { type: integer }
    LeadSourceInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        code: { type: string, description: "Defaults to a slug of the name" }
        isSocial: { type: boolean }
        active: { type: boolean }
        sortOrder: { type: integer }
    LeadSourceUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        isSocial: { type: boolean }
        active: { type: boolean }
        sortOrder: { type: integer }
    ChecklistItemConfig:
      type: object
      required: [key, label, enabled]
      properties:
        key:
          type: string
          enum: [contact_details, vehicle_selected, budget_discussed, test_drive_booked, licence_on_file, waiver_signed, vehicle_available, test_drive_completed, deal_created, deal_exists, deposit_taken, finance_approved]
        label: { type: string, minLength: 1, maxLength: 200 }
        enabled: { type: boolean }
    StageChecklistConfig:
      type: object
      required: [stage, version, items]
      properties:
        stage: { type: string, enum: [qualified, test_drive, negotiation, sold] }
        version: { type: integer }
        items:
          type: array
          items:
            $ref: "#/components/schemas/ChecklistItemConfig"
        updatedBy: { type: ["string", "null"] }
        updatedAt: { type: ["string", "null"], format: date-time }
    StageChecklistInput:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ChecklistItemConfig"
    DealerTaxRule:
      type: object
      required: [id, dealerId, name, code, kind, rate, effectiveFrom, active, sortOrder]
      properties:
        id: { type: integer }
        dealerId: { type: integer }
        name: { type: string }
        code: { type: string }
        kind: { type: string, enum: [percent, fixed] }
        rate: { type: number }
        thresholdAmount: { type: ["number", "null"] }
        excludeEv: { type: boolean }
        effectiveFrom: { type: string, format: date }
        active: { type: boolean }
        sortOrder: { type: integer }
        notes: { type: ["string", "null"] }
    DealerTaxInput:
      type: object
      required: [name, kind, rate]
      properties:
        name: { type: string, minLength: 1 }
        code: { type: string }
        kind: { type: string, enum: [percent, fixed] }
        rate: { type: number, minimum: 0 }
        thresholdAmount: { type: ["number", "null"] }
        excludeEv: { type: boolean }
        effectiveFrom: { type: string, format: date }
        active: { type: boolean }
        sortOrder: { type: integer }
        notes: { type: ["string", "null"] }
    DealerTaxUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        kind: { type: string, enum: [percent, fixed] }
        rate: { type: number, minimum: 0 }
        thresholdAmount: { type: ["number", "null"] }
        excludeEv: { type: boolean }
        effectiveFrom: { type: string, format: date }
        active: { type: boolean }
        sortOrder: { type: integer }
        notes: { type: ["string", "null"] }
    RoleInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
    RoleUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
    AuditLogEntry:
      type: object
      required: [id, action, module, summary, createdAt]
      properties:
        id: { type: integer }
        actorUserId: { type: ["integer", "null"] }
        actorName: { type: ["string", "null"] }
        actorEmail: { type: ["string", "null"] }
        action: { type: string }
        module: { type: string }
        entityType: { type: ["string", "null"] }
        entityId: { type: ["string", "null"] }
        summary: { type: string }
        details: { type: ["object", "null"], additionalProperties: true }
        statusCode: { type: ["integer", "null"] }
        createdAt: { type: string, format: date-time }

    AnthropicConversation:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - createdAt
    AnthropicMessage:
      type: object
      properties:
        id:
          type: integer
        conversationId:
          type: integer
        role:
          type: string
        content:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - conversationId
        - role
        - content
        - createdAt
    AnthropicConversationInput:
      type: object
      properties:
        title:
          type: string
      required:
        - title
    AnthropicMessageInput:
      type: object
      properties:
        content:
          type: string
      required:
        - content
    AnthropicConversationWithMessages:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        messages:
          type: array
          items:
            $ref: "#/components/schemas/AnthropicMessage"
      required:
        - id
        - title
        - createdAt
        - messages
    AnthropicError:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
          description: Original file name.
        size:
