        status: { type: string, description: pending_gate | filed | rejected }
        ownerName: { type: string }
        tin: { type: string }
        vin: { type: string }
        make: { type: string }
        model: { type: string }
        year: { type: integer }
        engineCc: { type: integer }
        fuelType: { type: string }
        hsCode: { type: string }
        cifValue: { type: number, description: USD-scale, human-confirmed }
        fobValue: { type: ["number", "null"] }
        freightValue: { type: ["number", "null"] }
        insuranceValue: { type: ["number", "null"] }
        sourceDocIds:
          type: ["array", "null"]
          items: { type: integer }
        fieldConfidence:
          type: ["object", "null"]
          additionalProperties: { type: number }
        yearOfImport: { type: ["integer", "null"] }
        exchangeRate: { type: number, description: usdExchangeRate snapshot at review time — later rate drift never mutates a filed duty }
        evExcluded: { type: boolean }
        taxLines:
          type: array
          items: { $ref: "#/components/schemas/GraTaxLine" }
        totalPayable: { type: number, description: USD-scale, server-computed from dealer_taxes }
        sourceNotes: { type: ["string", "null"] }
        filedBy: { type: ["string", "null"] }
        filedAt: { type: ["string", "null"], format: date-time }
        createdBy: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }

