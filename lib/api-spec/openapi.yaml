        resolvedAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
    GateResolution:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [approve, adjust, dismiss] }
        note: { type: string }
        adjustedAmount: { type: number }
        resolvedBy: { type: string }

    GraExtractRequest:
      type: object
      required: [imageBase64, mediaType]
      properties:
        imageBase64:
          type: string
          description: Base64-encoded document image (no data-URL prefix)
        mediaType:
          type: string
          enum: [image/png, image/jpeg, image/webp, image/gif]
    GraFilingDraft:
      type: object
      required:
        - ownerName
        - tin
        - vin
        - make
        - model
        - year
        - engineCc
        - fuelType
        - hsCode
        - cifValue
        - importDuty
        - vat
        - nhil
        - getfundLevy
        - exciseDuty
        - totalPayable
      properties:
        ownerName: { type: string }
        tin: { type: string, description: Taxpayer Identification Number }
        vin: { type: string, description: Chassis / VIN number }
        make: { type: string }
        model: { type: string }
        year: { type: integer }
        engineCc: { type: integer, description: Engine capacity in cubic centimetres }
        fuelType: { type: string }
        hsCode: { type: string, description: Harmonised System tariff code }
        cifValue: { type: number, description: Cost, Insurance & Freight value in GHS }
        importDuty: { type: number }
        vat: { type: number }
        nhil: { type: number, description: National Health Insurance Levy }
        getfundLevy: { type: number, description: GETFund Levy }
        exciseDuty: { type: number }
        totalPayable: { type: number }
        notes: { type: ["string", "null"] }
    GraFilingSubmission:
      type: object
      required: [draft]
      properties:
        draft: { $ref: "#/components/schemas/GraFilingDraft" }

    Customer360:
      type: object
      required: [customer, ownedVehicles, deals, appraisals, financeApplications, serviceOrders, leads, timeline, openGates]
      properties:
        customer: { $ref: "#/components/schemas/Customer" }
        ownedVehicles:
          type: array
          items: { $ref: "#/components/schemas/Vehicle" }
        activeDeal:
          oneOf:
            - $ref: "#/components/schemas/Deal"
            - type: "null"
        deals:
          type: array
          items: { $ref: "#/components/schemas/Deal" }
        appraisals:
          type: array
          items: { $ref: "#/components/schemas/Appraisal" }
        financeApplications:
          type: array
          items: { $ref: "#/components/schemas/FinanceApplication" }
        serviceOrders:
          type: array
          items: { $ref: "#/components/schemas/ServiceOrder" }
        leads:
          type: array
          items: { $ref: "#/components/schemas/Lead" }
        timeline:
          type: array
          items: { $ref: "#/components/schemas/TimelineEvent" }
        openGates:
          type: array
          items: { $ref: "#/components/schemas/Gate" }
