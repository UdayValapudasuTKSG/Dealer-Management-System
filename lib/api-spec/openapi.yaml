      type: object
      description: Files the confirmed duty sheet. Requires the gra_filing gate to be RESOLVED (409 otherwise); taxLines must match the server recompute (422 otherwise).
      required: [gateId, cif, exchangeRate, taxLines]
      properties:
        gateId: { type: integer, description: Resolved gra_filing gate that authorises this filing }
        vehicleId: { type: ["integer", "null"] }
        cif: { type: number, description: USD-scale CIF, must match the gated duty sheet }
        exchangeRate: { type: number, description: Snapshotted usdExchangeRate, must match the gated sheet }
        taxLines:
          type: array
          items: { $ref: "#/components/schemas/GraTaxLine" }
        evExcluded: { type: ["boolean", "null"] }
        sourceDocIds:
          type: ["array", "null"]
          items: { type: integer }
