        missingScopes:
          type: ["array", "null"]
          items: { type: string }
          description: "Required permissions the stored token lacks; null when scopes could not be inspected"
        scopesOk: { type: ["boolean", "null"], description: "True when all required permissions are granted; null when scopes could not be inspected" }
