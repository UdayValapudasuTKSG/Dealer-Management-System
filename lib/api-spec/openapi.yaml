openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: AURA Dealership Operating System API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: erpnext
  - name: amber
    description: ERPNext integration settings and sync
  - name: vehicles
    description: Inventory of vehicles
  - name: bookings
    description: Vehicle reservations and bookings
  - name: deliveries
    description: Vehicle delivery workflow
  - name: leads
    description: Sales leads and demand
  - name: customers
    description: Customer records
  - name: deals
    description: Deal desking and negotiation
  - name: appraisals
    description: Trade-in appraisals
  - name: finance
    description: Finance applications
  - name: service
    description: Service and repair orders
  - name: parts
    description: Parts inventory, suppliers and purchases
  - name: agents
    description: AI agents
  - name: activity
    description: Activity feed
  - name: dashboard
    description: Aggregated dashboard data
  - name: timeline
    description: Connected cross-domain event receipts
  - name: gates
    description: Human decision gates (never-list)
  - name: anthropic
    description: Anthropic AI chat operations
  - name: auth
    description: Current user, session and effective permissions
  - name: divisions
    description: Dealership business divisions (CAM Motors / GT Automotive)
  - name: admin
    description: User, role and permission administration
  - name: audit
    description: Audit log of every significant action
  - name: emails
    description: Email engine, templates, queue and delivery logs
  - name: notifications
    description: In-app notification center
  - name: tasks
    description: Task management
  - name: webhooks
    description: Public signature-verified inbound webhooks (Meta Lead Ads, Twilio WhatsApp)
  - name: calendar
  - name: Storage
    description: Object storage upload and serving endpoints.
  - name: documents
    description: Typed, versioned documents on leads and vehicles with AI pre-fill review
  - name: whatsapp
    description: Per-dealer Meta WhatsApp Business channel settings
paths:
  /anthropic/conversations:
    get:
      operationId: listAnthropicConversations
      tags: [anthropic]
      summary: List all conversations
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AnthropicConversation"
    post:
      operationId: createAnthropicConversation
      tags: [anthropic]
      summary: Create a new conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnthropicConversationInput"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnthropicConversation"
  /anthropic/conversations/{id}:
    get:
      operationId: getAnthropicConversation
      tags: [anthropic]
      summary: Get conversation with messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnthropicConversationWithMessages"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnthropicError"
    delete:
      operationId: deleteAnthropicConversation
      tags: [anthropic]
      summary: Delete a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnthropicError"
  /anthropic/conversations/{id}/messages:
    get:
      operationId: listAnthropicMessages
      tags: [anthropic]
      summary: List messages in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AnthropicMessage"
    post:
      operationId: sendAnthropicMessage
      tags: [anthropic]
      summary: Send a message and receive an AI response (SSE stream)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnthropicMessageInput"
      responses:
        "200":
          description: SSE stream of assistant response chunks
          content:
            text/event-stream: {}
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /webhooks/meta:
    get:
      operationId: verifyMetaWebhook
      tags: [webhooks]
      summary: Meta webhook verification handshake (hub.challenge echo)
      description: "Public. Echoes hub.challenge when hub.verify_token matches META_VERIFY_TOKEN."
      parameters:
        - name: hub.mode
          in: query
          required: false
          schema: { type: string }
        - name: hub.verify_token
          in: query
          required: false
          schema: { type: string }
        - name: hub.challenge
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Challenge echoed
          content:
            text/plain:
              schema: { type: string }
        "403":
          description: Verification failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Webhook not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: receiveMetaWebhook
      tags: [webhooks]
      summary: Receive Meta Lead Ads leadgen events (signature-verified)
      description: "Public. Validates X-Hub-Signature-256 over the raw body, then fetches lead field data from the Graph API and creates pipeline leads."
      requestBody:
        required: true
        description: "Meta leadgen webhook payload (verified over the raw bytes)"
        content:
          application/json: {}
      responses:
        "200":
          description: Events acknowledged
          content:
            application/json:
              schema:
                type: object
                properties:
                  received: { type: integer }
                required: [received]
        "403":
          description: Invalid signature
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Webhook not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /webhooks/twilio/whatsapp:
    post:
      operationId: receiveTwilioWhatsappWebhook
      tags: [webhooks]
      summary: Receive an inbound Twilio WhatsApp message (signature-verified)
      description: "Public. Validates X-Twilio-Signature; creates a whatsapp-source lead (or appends to an open lead's timeline) and replies with a TwiML acknowledgment."
      requestBody:
        required: true
        description: "Twilio's standard form-encoded inbound-message payload"
        content:
          application/x-www-form-urlencoded: {}
      responses:
        "200":
          description: TwiML acknowledgment reply
          content:
            text/xml: {}
        "403":
          description: Invalid signature
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Webhook not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /divisions:
    get:
      operationId: listDivisions
      tags: [divisions]
      summary: List the active dealership's business divisions
      responses:
        "200":
          description: List of divisions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Division"

  /vehicles:
    get:
      operationId: listVehicles
      tags: [vehicles]
      summary: List inventory vehicles
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string }
        - name: divisionId
          in: query
          required: false
          schema: { type: integer }
        - name: powertrain
          in: query
          required: false
          schema: { type: string }
        - name: search
          in: query
          required: false
          schema: { type: string }
        - name: includeDeleted
          in: query
          required: false
          schema: { type: boolean }
      responses:
        "200":
          description: List of vehicles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Vehicle"
    post:
      operationId: createVehicle
      tags: [vehicles]
      summary: Add a vehicle to inventory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VehicleInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vehicle"
  /vehicles/{id}:
    get:
      operationId: getVehicle
      tags: [vehicles]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Vehicle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vehicle"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updateVehicle
      tags: [vehicles]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VehicleUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vehicle"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteVehicle
      tags: [vehicles]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted
  /vehicles/{id}/restore:
    post:
      operationId: restoreVehicle
      tags: [vehicles]
      summary: Restore a soft-deleted vehicle
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Restored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vehicle"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /vehicles/import:
    post:
      operationId: importVehicles
      tags: [vehicles]
      summary: Preview or apply a bulk vehicle import from an Excel (.xlsx) file
      parameters:
        - name: mode
          in: query
          required: false
          description: "Preview validates without writing; apply revalidates and persists valid rows"
          schema:
            type: string
            enum: [preview, apply]
            default: preview
      requestBody:
        required: true
        description: "multipart/form-data with a single `file` field containing the .xlsx"
        content:
          multipart/form-data: {}
      responses:
        "200":
          description: Import summary (per-row results)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VehicleImportResult"
        "400":
          description: Missing or unreadable file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Spreadsheet has no recognizable vehicle columns
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /vehicles/import/template:
    get:
      operationId: downloadVehicleImportTemplate
      tags: [vehicles]
      summary: Download the Excel import template
      responses:
        "200":
          description: XLSX template file
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
  /vehicles/export:
    get:
      operationId: downloadVehicleInventory
      tags: [vehicles]
      summary: Download the active dealer's current vehicle inventory as Excel
      responses:
        "200":
          description: XLSX inventory workbook
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary

  /bookings:
    get:
      operationId: listBookings
      tags: [bookings]
      summary: List vehicle bookings (auto-expires lapsed reservations)
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string }
        - name: vehicleId
          in: query
          required: false
          schema: { type: integer }
      responses:
        "200":
          description: List of bookings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Booking"
    post:
      operationId: createBooking
      tags: [bookings]
      summary: Reserve a vehicle with a booking amount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "409":
          description: Vehicle is not available for booking, or the lead already has an active booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Reservation fee is mandatory unless a trusted-bypass waiver reason is recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /bookings/{id}:
    get:
      operationId: getBooking
      tags: [bookings]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updateBooking
      tags: [bookings]
      summary: Update payment status, expiry or cancel/release a booking
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Invalid transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /bookings/{id}/remind:
    post:
      operationId: sendBookingPaymentReminder
      tags: [bookings]
      summary: Send a payment reminder for the outstanding booking balance
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Reminder queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: No customer email or nothing outstanding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /deliveries:
    get:
      operationId: listDeliveries
      tags: [deliveries]
      summary: List delivery workflows
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string }
        - name: mine
          in: query
          required: false
          schema: { type: integer }
      responses:
        "200":
          description: List of deliveries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Delivery"
    post:
      operationId: createDelivery
      tags: [deliveries]
      summary: Start the delivery workflow for a deal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliveryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Delivery"
        "409":
          description: Delivery already exists for this deal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Deal not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /deliveries/{id}:
    get:
      operationId: getDelivery
      tags: [deliveries]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Delivery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Delivery"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updateDelivery
      tags: [deliveries]
      summary: Assign a delivery advisor
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliveryUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Delivery"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /deliveries/{id}/advance:
    post:
      operationId: advanceDelivery
      tags: [deliveries]
      summary: Complete the current delivery step (in strict order)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliveryAdvanceInput"
      responses:
        "200":
          description: Step completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Delivery"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Step out of order or requirements not met
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnmetError"
  /deliveries/{id}/revert:
    post:
      operationId: revertDeliveryStep
      tags: [deliveries]
      summary: Reopen a completed or skipped delivery step — moves the workflow back to it
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliveryRevertInput"
      responses:
        "200":
          description: Step reopened
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Delivery"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Step cannot be reopened
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /deliveries/{id}/pdi:
    patch:
      operationId: updateDeliveryPdi
      tags: [deliveries]
      summary: Update the PDI checklist items
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliveryPdiInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Delivery"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /deliveries/{id}/invoice.pdf:
    get:
      operationId: getDeliveryInvoicePdf
      tags: [deliveries]
      summary: Download the delivery invoice as a PDF
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Invoice PDF
          content:
            application/pdf: {}
        "404":
          description: Not found or invoice not generated yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /deliveries/{id}/handover.pdf:
    get:
      operationId: getDeliveryHandoverPdf
      tags: [deliveries]
      summary: Download the pre-filled vehicle handover form as a PDF
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Handover form PDF
          content:
            application/pdf: {}
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /deliveries/{id}/warranty-email:
    post:
      operationId: sendDeliveryWarrantyEmail
      tags: [deliveries]
      summary: Email the autofilled warranty booklet to the customer
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Warranty email queued
          content:
            application/json:
              schema:
                type: object
                required: [queued, recipient]
                properties:
                  queued: { type: boolean }
                  recipient: { type: string }
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: No customer email on file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /delivery-advisors:
    get:
      operationId: listDeliveryAdvisors
      tags: [deliveries]
      summary: List users assignable as delivery advisors
      responses:
        "200":
          description: Assignable delivery advisors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeliveryAdvisor"

  /leads:
    get:
      operationId: listLeads
      tags: [leads]
      summary: List leads
      parameters:
        - name: phase
          in: query
          required: false
          schema: { type: string }
        - name: status
          in: query
          required: false
          schema: { type: string }
        - name: divisionId
          in: query
          required: false
          schema: { type: integer }
        - name: includeDeleted
          in: query
          required: false
          schema: { type: boolean }
        - name: createdFrom
          in: query
          required: false
          schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        - name: createdTo
          in: query
          required: false
          schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
      responses:
        "200":
          description: List of leads
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lead"
    post:
      operationId: createLead
      tags: [leads]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadInput"
      responses:
        "201":
          description: Created (or merged into an existing open duplicate lead)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadCreateResult"
  /leads/{id}:
    get:
      operationId: getLead
      tags: [leads]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updateLead
      tags: [leads]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
