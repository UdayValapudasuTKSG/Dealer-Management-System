          description: Base64-encoded document image (no data-URL prefix)
        mediaType:
          type: string
          enum: [image/png, image/jpeg, image/webp, image/gif]
        sourceDocId:
          type: ["integer", "null"]
          description: documents.id of the uploaded customs/manifest/proforma file, for traceability
    GraExtractedFields:
      type: object
      description: Legible-only allowlist — the model NEVER returns TIN, VIN, owner or any duty figure; those are human-keyed from the source documents
      properties:
        make: { type: ["string", "null"] }
        model: { type: ["string", "null"] }
        year: { type: ["integer", "null"] }
        cifPrinted: { type: ["number", "null"], description: CIF value exactly as printed on the document (USD-scale), human-confirmed before any duty compute }
        engineCc: { type: ["integer", "null"] }
        fuelType: { type: ["string", "null"] }
    GraExtractResponse:
      type: object
      required: [fields, confidence, dropped]
      properties:
        fields: { $ref: "#/components/schemas/GraExtractedFields" }
        confidence:
          type: object
          description: Per-field confidence 0-1 for the fields that were kept
          additionalProperties: { type: number }
        dropped:
          type: array
          description: Fields below MIN_AGENT_CONFIDENCE or illegible — dropped, flagged for human key-in, never auto-filled
          items: { type: string }
        notes: { type: ["string", "null"], description: Model remark on legibility, wrapped via guardUntrusted }
    GraTaxLine:
      type: object
      required: [code, name, kind, rate, amount]
      properties:
        code: { type: string }
        name: { type: string }
        kind: { type: string, enum: [percent, fixed] }
        rate: { type: number }
        amount: { type: number, description: USD-scale amount computed server-side }
        basis: { type: ["string", "null"], description: Human-readable base the line was computed on }
        baseAmount: { type: ["number", "null"], description: USD-scale base the rate applied to (null for fixed lines) }
    GraFilingDraft:
      type: object
      description: Human-confirmed filing inputs. TIN/VIN/owner are keyed by the officer from source docs; duty is NEVER part of the draft — the server computes it from dealer_taxes.
      required:
        - ownerName
        - tin
        - vin
        - make
        - model
        - year
        - engineCc
        - fuelType
        - hsCode
        - cifValue
      properties:
        ownerName: { type: string }
        tin: { type: string, description: Guyana Taxpayer Identification Number — human-keyed, never extracted }
        vin: { type: string, description: Chassis / VIN number — human-keyed, never extracted }
        make: { type: string }
        model: { type: string }
        year: { type: integer }
        engineCc: { type: integer, description: Engine capacity in cubic centimetres }
        fuelType: { type: string }
        hsCode: { type: string, description: Harmonised System tariff code }
        cifValue: { type: number, description: Cost, Insurance & Freight value, USD-scale, human-confirmed }
        fobValue: { type: ["number", "null"], description: FOB component of CIF (USD-scale) }
        freightValue: { type: ["number", "null"], description: Freight component of CIF (USD-scale) }
        insuranceValue: { type: ["number", "null"], description: Insurance component of CIF (USD-scale) }
        yearOfImport: { type: ["integer", "null"] }
        sourceDocIds:
          type: ["array", "null"]
          description: documents.id references every figure traces back to
          items: { type: integer }
        fieldConfidence:
          type: ["object", "null"]
          description: Per-field AI extraction confidence carried through for the duty pack
          additionalProperties: { type: number }
        notes: { type: ["string", "null"] }
    GraComputeRequest:
      type: object
      required: [cifValue]
      properties:
        cifValue: { type: number, description: USD-scale CIF value }
        fuelType: { type: ["string", "null"] }
        engineCc: { type: ["integer", "null"] }
        yearOfManufacture: { type: ["integer", "null"] }
        yearOfImport: { type: ["integer", "null"] }
    GraComputeResponse:
      type: object
      required: [taxLines, totalPayable, reviewFlags, missingInputs, isEv, evSkipped]
      properties:
        taxLines:
          type: array
          items: { $ref: "#/components/schemas/GraTaxLine" }
        totalPayable: { type: number }
        reviewFlags:
          type: array
          items: { type: string }
        missingInputs:
          type: array
          items: { type: string }
        isEv: { type: boolean }
        evSkipped:
          type: array
          description: dealer_taxes rules skipped because the vehicle is electric (excludeEv)
          items: { type: string }
    GraReviewSubmission:
      type: object
      required: [draft]
      properties:
        draft: { $ref: "#/components/schemas/GraFilingDraft" }
        vehicleId: { type: ["integer", "null"], description: Imported vehicle this filing clears }
        dealId: { type: ["integer", "null"], description: Deal this filing clears customs for }
