  /service-orders:
    get:
      operationId: listServiceOrders
      tags: [service]
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: List of service orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServiceOrder"
    post:
      operationId: createServiceOrder
      tags: [service]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceOrderInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceOrder"
  /service-orders/{id}:
    patch:
      operationId: updateServiceOrder
      tags: [service]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceOrderUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceOrder"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /agents:
    get:
      operationId: listAgents
      tags: [agents]
      responses:
        "200":
          description: List of AI agents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Agent"
  /agents/{id}:
    get:
      operationId: getAgent
      tags: [agents]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updateAgent
      tags: [agents]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /activity:
    get:
      operationId: listActivity
      tags: [activity]
      summary: Recent activity feed across the dealership
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer }
      responses:
        "200":
          description: Activity feed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Activity"

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Headline metrics for the command center
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /dashboard/pipeline:
    get:
      operationId: getPipeline
      tags: [dashboard]
      summary: Lead pipeline funnel by journey phase
      responses:
        "200":
          description: Pipeline stages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PipelineStage"
  /dashboard/sales-performance:
    get:
      operationId: getSalesPerformance
      tags: [dashboard]
      summary: Monthly revenue and unit sales
      responses:
        "200":
          description: Sales performance series
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SalesPoint"
  /dashboard/inventory-breakdown:
    get:
      operationId: getInventoryBreakdown
      tags: [dashboard]
      summary: Inventory counts grouped by powertrain
      responses:
        "200":
          description: Inventory breakdown
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryBreakdownItem"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Error:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    Vehicle:
      type: object
      required: [id, make, model, year, price, powertrain, mileageKm, exteriorColor, status, bodyType, featured, createdAt]
      properties:
        id: { type: integer }
        make: { type: string }
        model: { type: string }
        trim: { type: ["string", "null"] }
        year: { type: integer }
        vin: { type: ["string", "null"] }
        price: { type: number }
        powertrain: { type: string, enum: [EV, Hybrid, Petrol, Diesel] }
        rangeKm: { type: ["integer", "null"] }
        mileageKm: { type: integer }
        exteriorColor: { type: string }
        bodyType: { type: string }
        status: { type: string, enum: [available, reserved, in_transit, sold, service] }
        imageUrl: { type: ["string", "null"] }
        description: { type: ["string", "null"] }
        featured: { type: boolean }
        createdAt: { type: string, format: date-time }
    VehicleInput:
      type: object
      required: [make, model, year, price, powertrain, mileageKm, exteriorColor, bodyType]
      properties:
        make: { type: string, minLength: 1 }
        model: { type: string, minLength: 1 }
        trim: { type: string }
        year: { type: integer }
        vin: { type: string }
        price: { type: number }
        powertrain: { type: string, enum: [EV, Hybrid, Petrol, Diesel] }
        rangeKm: { type: integer }
        mileageKm: { type: integer }
        exteriorColor: { type: string }
        bodyType: { type: string }
        status: { type: string, enum: [available, reserved, in_transit, sold, service] }
        imageUrl: { type: string }
        description: { type: string }
        featured: { type: boolean }
    VehicleUpdate:
      type: object
      properties:
        make: { type: string, minLength: 1 }
        model: { type: string, minLength: 1 }
        trim: { type: string }
        year: { type: integer }
        vin: { type: string }
        price: { type: number }
        powertrain: { type: string, enum: [EV, Hybrid, Petrol, Diesel] }
        rangeKm: { type: integer }
        mileageKm: { type: integer }
        exteriorColor: { type: string }
        bodyType: { type: string }
        status: { type: string, enum: [available, reserved, in_transit, sold, service] }
        imageUrl: { type: string }
        description: { type: string }
        featured: { type: boolean }

    Lead:
      type: object
      required: [id, name, channel, phase, status, aiScore, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        channel: { type: string, enum: [web, social, mobile, walkin] }
        phase: { type: string, enum: [aware, consider, engage, negotiate, won, lost] }
        status: { type: string, enum: [new, qualified, engaged, converted, lost] }
        interestedVehicleId: { type: ["integer", "null"] }
        assignedTo: { type: ["string", "null"] }
        aiScore: { type: integer }
        notes: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
    LeadInput:
      type: object
      required: [name, channel]
      properties:
        name: { type: string, minLength: 1 }
        email: { type: string }
        phone: { type: string }
        channel: { type: string, enum: [web, social, mobile, walkin] }
        phase: { type: string, enum: [aware, consider, engage, negotiate, won, lost] }
        status: { type: string, enum: [new, qualified, engaged, converted, lost] }
        interestedVehicleId: { type: integer }
        assignedTo: { type: string }
        aiScore: { type: integer }
        notes: { type: string }
    LeadUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        email: { type: string }
        phone: { type: string }
        channel: { type: string, enum: [web, social, mobile, walkin] }
        phase: { type: string, enum: [aware, consider, engage, negotiate, won, lost] }
        status: { type: string, enum: [new, qualified, engaged, converted, lost] }
        interestedVehicleId: { type: integer }
        assignedTo: { type: string }
        aiScore: { type: integer }
        notes: { type: string }

    Customer:
      type: object
      required: [id, name, lifetimeValue, vehiclesOwned, loyaltyTier, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        avatarUrl: { type: ["string", "null"] }
        location: { type: ["string", "null"] }
        lifetimeValue: { type: number }
        vehiclesOwned: { type: integer }
        loyaltyTier: { type: string, enum: [new, silver, gold, platinum] }
        createdAt: { type: string, format: date-time }
    CustomerInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        email: { type: string }
        phone: { type: string }
        avatarUrl: { type: string }
        location: { type: string }
        lifetimeValue: { type: number }
        vehiclesOwned: { type: integer }
        loyaltyTier: { type: string, enum: [new, silver, gold, platinum] }
    CustomerUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        email: { type: string }
        phone: { type: string }
        avatarUrl: { type: string }
        location: { type: string }
        lifetimeValue: { type: number }
        vehiclesOwned: { type: integer }
        loyaltyTier: { type: string, enum: [new, silver, gold, platinum] }

    Deal:
      type: object
      required: [id, vehicleId, stage, vehiclePrice, discount, tradeInValue, accessories, otdPrice, depositPaid, createdAt]
      properties:
        id: { type: integer }
        customerId: { type: ["integer", "null"] }
        leadId: { type: ["integer", "null"] }
        vehicleId: { type: integer }
        customerName: { type: ["string", "null"] }
        stage: { type: string, enum: [desking, negotiation, finance, committed, delivered, lost] }
        vehiclePrice: { type: number }
        discount: { type: number }
        tradeInValue: { type: number }
        accessories: { type: number }
        otdPrice: { type: number }
        monthlyPayment: { type: ["number", "null"] }
        depositPaid: { type: boolean }
        salesAdvisor: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
    DealInput:
      type: object
      required: [vehicleId, vehiclePrice]
      properties:
        customerId: { type: integer }
        leadId: { type: integer }
        vehicleId: { type: integer }
        customerName: { type: string }
        stage: { type: string, enum: [desking, negotiation, finance, committed, delivered, lost] }
        vehiclePrice: { type: number }
        discount: { type: number }
        tradeInValue: { type: number }
        accessories: { type: number }
        otdPrice: { type: number }
        monthlyPayment: { type: number }
        depositPaid: { type: boolean }
        salesAdvisor: { type: string }
    DealUpdate:
      type: object
      properties:
        customerId: { type: integer }
        leadId: { type: integer }
        vehicleId: { type: integer }
        customerName: { type: string }
        stage: { type: string, enum: [desking, negotiation, finance, committed, delivered, lost] }
        vehiclePrice: { type: number }
        discount: { type: number }
        tradeInValue: { type: number }
        accessories: { type: number }
        otdPrice: { type: number }
        monthlyPayment: { type: number }
        depositPaid: { type: boolean }
        salesAdvisor: { type: string }

    Appraisal:
      type: object
      required: [id, year, make, model, mileageKm, condition, aiEstimate, status, createdAt]
      properties:
        id: { type: integer }
        customerId: { type: ["integer", "null"] }
        customerName: { type: ["string", "null"] }
        year: { type: integer }
        make: { type: string }
        model: { type: string }
        mileageKm: { type: integer }
        condition: { type: string, enum: [excellent, good, fair, poor] }
        aiEstimate: { type: number }
        finalOffer: { type: ["number", "null"] }
        status: { type: string, enum: [pending, valued, accepted, declined] }
        notes: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
    AppraisalInput:
      type: object
      required: [year, make, model, mileageKm, condition]
      properties:
        customerId: { type: integer }
        customerName: { type: string }
        year: { type: integer }
        make: { type: string, minLength: 1 }
