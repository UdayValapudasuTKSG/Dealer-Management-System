      responses:
        "201":
          description: Vehicle added to customer garage
          content:
            application/json:
              schema:
                type: object
                required: [state, vehicle]
                properties:
                  state: { type: string, enum: [submitted] }
                  vehicle: { $ref: "#/components/schemas/GarageVehicle" }

components:
  schemas:
    ServiceOrderClaimRequest:
      type: object
      properties:
        technicianUserId: { type: integer }
    VehicleOnboardingUploadRequest:
      type: object
      required: [kind, mimeType]
      properties:
        kind: { type: string, enum: [image, video] }
        mimeType: { type: string }
        originalName: { type: string }
    GarageVehicle:
      type: object
      required: [id, dealerId, customerId, registration, make, model, createdAt, updatedAt]
      properties:
        id: { type: integer }
        dealerId: { type: integer }
        customerId: { type: integer }
        registration: { type: string }
        vinChassis: { type: ["string", "null"] }
        make: { type: string }
        model: { type: string }
        year: { type: ["integer", "null"] }
        colour: { type: ["string", "null"] }
        mileage: { type: ["integer", "null"] }
        notes: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    VehicleOnboardingSubmission:
      type: object
      required: [registration, make, model]
      properties:
        registration: { type: string, minLength: 1, maxLength: 40 }
        vinChassis: { type: string, maxLength: 80 }
        make: { type: string, minLength: 1, maxLength: 80 }
        model: { type: string, minLength: 1, maxLength: 80 }
        year: { type: integer, minimum: 1900 }
        colour: { type: string, maxLength: 50 }
        mileage: { type: integer, minimum: 0, maximum: 10000000 }
        notes: { type: string, maxLength: 4000 }
    VehicleOnboardingState:
      type: object
      required: [state, customerName, expiresAt, media]
      properties:
        state: { type: string, enum: [open, expired, submitted] }
        customerName: { type: string }
        expiresAt: { type: string, format: date-time }
        media:
          type: array
          items:
            type: object
            required: [id, kind, mimeType, sizeBytes]
            properties:
              id: { type: integer }
              kind: { type: string, enum: [image, video] }
              mimeType: { type: string }
              sizeBytes: { type: integer }
